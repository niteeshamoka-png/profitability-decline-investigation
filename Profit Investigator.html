<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Profit Investigator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: investigation desk. Left rail of case files, a main board of evidence panels, department hues as the only chroma; red is reserved for the decline. */
:root{
  --bg:#f1f0ec;--panel:#fcfcfb;--sunk:#f6f5f1;--ink:#14130f;--ink2:#52514e;--mut:#6d6b65;
  --line:#e1e0d9;--axis:#c3c2b7;--shade:rgba(208,59,59,.07);
  --c-m:#2a78d6;--c-h:#eb6834;--c-o:#1baf7a;--c-f:#6250d6;
  --crit:#d03b3b;--crit-t:#b02a2a;--good:#0ca30c;--good-t:#006300;--warn:#fab219;
  --pos:#e34948;--neg:#2a78d6;--mid:#ebeae4;
  --btn:#14130f;--btn-i:#fcfcfb;--hit:rgba(20,19,15,.05);
  --disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0c0b;--panel:#161615;--sunk:#111110;--ink:#f0efec;--ink2:#c3c2b7;--mut:#9a988f;
  --line:#2c2c2a;--axis:#3d3d3a;--shade:rgba(230,103,103,.10);
  --c-m:#3987e5;--c-h:#d95926;--c-o:#199e70;--c-f:#9085e9;
  --crit:#e66767;--crit-t:#f08a8a;--good-t:#4fcf4f;
  --pos:#e66767;--neg:#3987e5;--mid:#2a2a28;
  --btn:#f0efec;--btn-i:#161615;--hit:rgba(240,239,236,.07);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0b;--panel:#161615;--sunk:#111110;--ink:#f0efec;--ink2:#c3c2b7;--mut:#9a988f;
  --line:#2c2c2a;--axis:#3d3d3a;--shade:rgba(230,103,103,.10);
  --c-m:#3987e5;--c-h:#d95926;--c-o:#199e70;--c-f:#9085e9;
  --crit:#e66767;--crit-t:#f08a8a;--good-t:#4fcf4f;
  --pos:#e66767;--neg:#3987e5;--mid:#2a2a28;
  --btn:#f0efec;--btn-i:#161615;--hit:rgba(240,239,236,.07);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow:auto;padding:22px 16px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:var(--sunk)}
.brand{display:flex;gap:11px;align-items:center}
.mark{width:34px;height:34px;border-radius:9px;background:var(--ink);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:7px}
.mark i{border-radius:2px}.mark i:nth-child(1){background:var(--c-m)}.mark i:nth-child(2){background:var(--c-h)}.mark i:nth-child(3){background:var(--c-o)}.mark i:nth-child(4){background:var(--c-f)}
.brand b{font:700 16px/1.1 var(--disp);display:block;letter-spacing:-.01em}.brand span{font:11px var(--mono);color:var(--mut)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a svg{width:16px;height:16px;flex:none}
.nav a:hover{background:var(--hit)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--btn-i)}
.nav .sec{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:10px 10px 4px}
.agentbox{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--ink2)}
.agentbox .live{display:flex;align-items:center;gap:7px;font:500 11px var(--mono);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
/* main */
.main{min-width:0;padding-bottom:48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px max(24px,env(safe-area-inset-right,0px)) 12px 28px}
.top h1{font:700 22px/1.15 var(--disp);letter-spacing:-.015em}
.top .sub{font-size:12.5px;color:var(--mut)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font:500 11px var(--mono);border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--ink2);background:var(--panel);white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:32px;height:32px;display:grid;place-items:center}
.iconbtn:hover{background:var(--hit)}
.view{padding:22px max(24px,env(safe-area-inset-right,0px)) 0 28px;display:flex;flex-direction:column;gap:18px}
.view[hidden]{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h2{font:700 16px/1.25 var(--disp);letter-spacing:-.005em}
.card .lede{color:var(--mut);font-size:12.5px;margin-top:3px;max-width:68ch}
.eyebrow{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.g2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.g21{display:grid;gap:18px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
@media(max-width:1100px){.g21{grid-template-columns:minmax(0,1fr)}}
/* hero + kpi */
.hero{display:grid;gap:18px;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:stretch}
@media(max-width:1100px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .say{display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.hero .say h2{font:700 clamp(26px,3.4vw,38px)/1.08 var(--disp);letter-spacing:-.025em;text-wrap:balance}
.hero h2 em{font-style:normal;color:var(--crit-t)}
.hero p{color:var(--ink2);max-width:58ch}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--btn-i);border:0;border-radius:8px;padding:9px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{opacity:.88}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--axis)}
.btn.ghost:hover{background:var(--hit)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .l{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .v{font:700 28px/1 var(--disp);letter-spacing:-.02em;display:flex;align-items:baseline;gap:4px}
.kpi .v small{font:500 12px var(--mono);color:var(--mut)}
.kpi .d{font:500 11.5px var(--mono);display:flex;gap:6px;align-items:center}
.bad{color:var(--crit-t)}.ok{color:var(--good-t)}
.dd{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.tag.crit{color:var(--crit-t);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.tag.good{color:var(--good-t);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
/* dept paradox rows */
.dept{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.dept:first-of-type{border-top:0;padding-top:4px}
.dept b{font-weight:600;display:flex;gap:8px;align-items:center}
.dept .s{font-size:12.5px;color:var(--ink2);grid-column:1/-1}
.dept .s u{text-decoration:none;color:var(--crit-t);font-weight:500}
/* charts */
.chart{width:100%;position:relative}
.chart svg{display:block;max-width:100%;overflow:visible}
svg text{font:11px var(--mono);fill:var(--mut)}
svg text.k{fill:var(--ink)}svg text.s{fill:var(--ink2)}
.hit{fill:transparent}
.col .guide{opacity:0;stroke:var(--axis)}
.col:hover .guide{opacity:1}
.col .pt{opacity:0}.col:hover .pt{opacity:1}
.cellr{cursor:pointer}.cellr:hover{stroke:var(--ink);stroke-width:1.5}
.scroll{overflow-x:auto}.scroll .chart svg{max-width:none}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--btn-i);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;max-width:260px;opacity:0;transition:opacity .08s;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#tip b{font-family:var(--mono);font-weight:500;display:block;margin-bottom:2px}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 11px;font:500 12px var(--mono);color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--btn-i)}
/* agent run */
.agents{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.ag{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--sunk);display:flex;flex-direction:column;gap:6px;transition:background .2s,border-color .2s}
.ag b{font-size:12.5px;display:flex;gap:7px;align-items:center}
.ag span{font:11px var(--mono);color:var(--mut)}
.ag[data-s="work"]{background:var(--panel);border-color:var(--ink)}
.ag[data-s="done"] span::before{content:"✓ "}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .4s}
.log{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px;font:12px/1.55 var(--mono);height:360px;overflow:auto;display:flex;flex-direction:column;gap:9px}
.log .ln{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.log .who{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500;white-space:nowrap}
.log .tl{color:var(--mut)}
.log .tx2{grid-column:2;color:var(--ink2);font-family:var(--body);font-size:12.5px}
.hyp{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.hyp .t{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.hyp h3{font:700 15px/1.25 var(--disp)}
.hyp .t>div:last-child{white-space:nowrap}.rank{font:700 12px var(--mono);width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--btn-i);display:grid;place-items:center;flex:none}
.ev{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:3px 12px;font:12px var(--mono);color:var(--ink2)}
.ev span.n{color:var(--ink)}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink)}
.note{font-size:12.5px;color:var(--ink2);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.chain .nd{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:2px 8px;background:var(--sunk)}
.chain .ar{color:var(--mut)}
/* chat */
.chatwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
@media(max-width:1100px){.chatwrap{grid-template-columns:minmax(0,1fr)}}
.chat{display:flex;flex-direction:column;height:min(720px,78vh);min-height:480px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px 12px}
.msg{display:flex;gap:10px;max-width:92%}
.msg.u{align-self:flex-end;flex-direction:row-reverse}
.av{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--btn-i);font:700 12px var(--mono);display:grid;place-items:center;flex:none}
.msg.u .av{background:var(--c-m);color:#fff}
.bub{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 13px;min-width:0;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.msg.u .bub{background:var(--ink);color:var(--btn-i);border-color:var(--ink)}
.bub p+p{margin-top:6px}
.bub ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{font:11px var(--mono);border:1px dashed var(--axis);border-radius:6px;padding:1px 7px;color:var(--mut)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0}
.sugg button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;font-size:12px;color:var(--ink2)}
.sugg button:hover{background:var(--hit);color:var(--ink)}
.ask{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.ask input{flex:1;min-width:0;border:1px solid var(--axis);background:var(--panel);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit}
.mini{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;font:12px var(--mono);align-items:center}
.mini .bb{height:8px;border-radius:3px;background:var(--line);overflow:hidden}.mini .bb i{display:block;height:100%}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mut);margin-right:3px;animation:pulse 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
/* simulator */
.sim{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px}
@media(max-width:1100px){.sim{grid-template-columns:minmax(0,1fr)}}
.lever{display:flex;flex-direction:column;gap:5px;padding:12px 0;border-top:1px solid var(--line)}
.lever:first-of-type{border-top:0}
.lever label{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:13px}
.lever label output{font:500 12px var(--mono);color:var(--ink)}
.lever small{color:var(--mut);font-size:12px}
input[type=range]{width:100%;accent-color:var(--ink)}
.res{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.res>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sunk)}
.res .l{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.res .v{font:700 22px/1.2 var(--disp)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--sunk);position:sticky;top:0}
td.n{font-family:var(--mono)}
/* actions */
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act h3{font:600 14px/1.3 var(--body)}
.act .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sw{position:relative;width:42px;height:24px;border-radius:99px;border:1px solid var(--axis);background:var(--sunk);padding:0;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:transform .15s,background .15s}
.sw[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--btn-i)}
.dec{font:12px/1.6 var(--mono);color:var(--ink2);max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.steps{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.steps>div{display:flex;flex-direction:column;gap:6px}
.steps h3{font:700 14px var(--disp)}
.steps p{font-size:13px;color:var(--ink2)}
@media(max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;flex-direction:column;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav a{white-space:nowrap;border:1px solid var(--line);background:var(--panel)}
  .nav .sec,.agentbox{display:none}
  .top{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));position:static}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .card{padding:14px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ============ ASSUMED DATA: NovaCart Retail (synthetic), 12 quarters ============ */
const Q=["Q3'23","Q4'23","Q1'24","Q2'24","Q3'24","Q4'24","Q1'25","Q2'25","Q3'25","Q4'25","Q1'26","Q2'26"];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function pnl(s){

const N=Q.length;

const META={

 attr:{l:'Attrition',d:'H',u:'%',dp:1,g:-1,al:['attrition','turnover','quit']},
 train:{l:'Training hours',d:'H',u:' h',dp:0,g:1,al:['training']},
 enps:{l:'Employee eNPS',d:'H',u:'',dp:0,g:1,al:['enps','engagement','morale']},
 ttf:{l:'Time to fill',d:'H',u:' d',dp:0,g:-1,al:['time to fill','time-to-fill','hiring time','vacanc']},

function corr(a,b){const n=Math.min(a.length,b.length),ma=mean(a.slice(0,n)),mb=mean(b.slice(0,n));let s=0,x=0,y=0;for(let i=0;i<n;i++){const p=a[i]-ma,q=b[i]-mb;s+=p*q;x+=p*p;y+=q*q}return s/Math.sqrt(x*y)}

 const b=a.slice(0,4),m=mean(b),rg=Math.max(...a)-Math.min(...a);let sd=Math.sqrt(b.reduce((x,y)=>x+(y-m)**2,0)/3);sd=Math.max(sd,.03*rg);

const EDGES=[

function bridge(i0,i1){const a=stateAt(i0),b=stateAt(i1),p0=PL[i0],p1=PL[i1];

  {k:'vol',l:'Order volume',v:(b.orders-a.orders)*unit0/1e4,d:'M'},
  {k:'price',l:'Discounting & price mix',v:b.orders*((p1.net-p0.net)-(b.gross-a.gross)*COGS_RATIO)/1e4,d:'M'},
  {k:'mkt',l:'Marketing spend',v:-(p1.mkt-p0.mkt),d:'M'},

function wfChart(w,b){

function simulate(c){const R=[.35,.65,.9,1],out=[],bas=[];let pv={st:0,ot:0,at:0,of:0,cs:0};

  const dSt=B.sd*dD-(c.plan/100)*.35*Math.max(0,b.stockout-3.1)*r,dOt=B.ot*dSt,dOf=B.otif*dSt,dAt=B.attr*pv.ot-c.ret*1.6*r,dRe=B.ret*pv.at,dCs=B.cs*pv.of,dCa=B.cac*pv.cs;
  const s={...b,disc:b.disc+dD,stockout:b.stockout+dSt,ot:Math.max(4,b.ot+dOt),otif:Math.min(96,b.otif+dOf),fulfil:b.fulfil+B.ful*dSt,inv:b.inv+B.inv*dSt,attr:Math.max(8,b.attr+dAt),train:b.train+c.ret*4*r,returns:Math.max(4,b.returns+dRe),csat:b.csat+dCs,cac:b.cac+dCa};

  <li>Profit attribution to causes uses editable assumed weights, listed in the investigation report.</li></ul></div>
  <div class="card"><h2>Metric dictionary</h2><div class="scroll" style="max-height:330px;margin-top:10px"><table><thead><tr><th>Metric</th><th>Dept</th><th>Q3'23</th><th>Q2'26</th></tr></thead><tbody>${IDS.map(k=>`<tr><td>${META[k].l}</td><td>${dtag(META[k].d)}${DEPT[META[k].d].n}</td><td class="n">${fv(k,SER[k][0])}</td><td class="n">${fv(k,SER[k][L])}</td></tr>`).join('')}</tbody></table></div></div></div>
 <div class="card"><div class="head"><div><h2>Data table</h2><div class="lede">Every metric by quarter, as the agent sees it.</div></div><div class="seg" id="dt">${['All','M','H','O','F'].map((d,i)=>`<button data-d="${d}" aria-pressed="${i===0}">${d==='All'?'All':DEPT[d].n}</button>`).join('')}</div></div><div class="scroll" style="max-height:420px"><table id="dtab"></table></div></div>`;
 const tab=f=>{$('#dtab').innerHTML=`<thead><tr><th>Metric</th>${Q.map(q=>`<th>${q}</th>`).join('')}</tr></thead><tbody>${IDS.filter(k=>f==='All'||META[k].d===f).map(k=>`<tr><td>${dtag(META[k].d)} ${META[k].l}</td>${SER[k].map(v=>`<td class="n">${META[k].pre?Math.round(v):v.toFixed(META[k].dp)}</td>`).join('')}</tr>`).join('')}</tbody>`};tab('All');
 $('#dt').onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('#dt button').forEach(x=>x.setAttribute('aria-pressed',x===b));tab(b.dataset.d)};
 mount($('#c-arch'),w=>{const W=Math.max(w,860),bx=(x,y,wd,t,sub,c)=>`<rect x="${x}" y="${y}" width="${wd}" height="54" rx="9" fill="var(--sunk)" stroke="${c||'var(--axis)'}" stroke-width="1.5"/><text x="${x+wd/2}" y="${y+23}" text-anchor="middle" class="k" style="font-family:var(--body);font-size:12.5px;font-weight:600">${t}</text><text x="${x+wd/2}" y="${y+40}" text-anchor="middle">${sub}</text>`;
  const ar=(x1,y1,x2,y2)=>`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="var(--mut)" stroke-width="1.5" marker-end="url(#ah2)"/>`;
  return `<svg viewBox="0 0 860 300" width="${W}" height="${W*300/860}" role="img" aria-label="Agent architecture"><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mut)"/></marker></defs>
  ${['M','H','O','F'].map((d,i)=>bx(10,10+i*68,150,DEPT[d].n+' data',['campaigns, CRM','payroll, exits','WMS, orders','ledger, P&L'][i],DEPT[d].v)).join('')}
  ${ar(160,37,215,150)}${ar(160,105,215,150)}${ar(160,173,215,150)}${ar(160,241,215,150)}
  ${bx(215,122,150,'Perception','clean, align, 12Q memory')}${ar(365,149,410,149)}
  ${bx(410,40,160,'4 department analysts','tool calls per function')}${bx(410,122,160,'Orchestrator','plans, delegates, ranks')}${bx(410,204,160,'Critic','detrend, caveats, risk')}
  ${ar(490,94,490,122)}${ar(490,204,490,176)}${ar(570,149,615,149)}
  ${bx(615,122,115,'Reasoning','graph + simulator')}${ar(730,149,765,149)}
  ${bx(765,122,90,'Human gate','approve / reject','var(--ink)')}
  <text x="430" y="290" text-anchor="middle">Perception → memory → reasoning with tools → critic → action only after human approval</text></svg>`})};
/* ---------- ask the agent ---------- */
BUILD.ask=()=>{
 const el=$('#v-ask');
 el.innerHTML=`<div class="chatwrap"><div class="card chat"><div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="sugg" id="sugg">${['Why did profit decline?','Which department is responsible?','How is attrition linked to stock-outs?','What if we cut discounts by 5 points?','What happened first?','What should we do next?','How reliable is this?'].map(q=>`<button>${q}</button>`).join('')}</div>
  <form class="ask" id="askf"><input id="q" autocomplete="off" placeholder="Ask about any metric, department or scenario" aria-label="Question for the agent"><button class="btn" type="submit">Ask</button></form></div>
  <div style="display:flex;flex-direction:column;gap:18px;min-width:0"><div class="card"><h2>Agent toolbox</h2><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:12.5px;color:var(--ink2)">
   ${[['finance.profit_bridge','P&L variance between quarters'],['stats.lagged_corr','levels and QoQ correlation with lags'],['stats.onset_timeline','first quarter each metric deviates'],['graph.rank_hypotheses','causal chains ranked by impact'],['sim.scenario','what-if on four levers'],['governance.check','assumptions and approval gates']].map(t=>`<div><span class="tool">${t[0]}</span><div style="margin-top:2px">${t[1]}</div></div>`).join('')}</div></div>
   <div class="card"><h2>Memory</h2><p style="font-size:12.5px;color:var(--ink2);margin-top:6px">${N} quarters × ${IDS.length} metrics, the profit bridge, the causal graph and the last scenario you ran. Answers are computed from this data, not looked up from text.</p></div></div></div>`;
 const box=$('#msgs');
 const add=(who,html)=>{box.insertAdjacentHTML('beforeend',`<div class="msg ${who==='u'?'u':''}"><div class="av">${who==='u'?'You':'AI'}</div><div class="bub">${html}</div></div>`);box.scrollTop=box.scrollHeight};
 const bars=(items,color)=>{const mx=Math.max(...items.map(i=>i[1]));return `<div class="mini">${items.map(i=>`<span>${i[0]}</span><div class="bb"><i style="width:${i[1]/mx*100}%;background:${i[3]||color}"></i></div><span>${i[2]}</span>`).join('')}</div>`};
 const tl=a=>`<div class="tools">${a.map(t=>`<span class="tool">${t}</span>`).join('')}</div>`;
 const find=q=>{let s=' '+q.toLowerCase()+' ',got=[];const al=[];IDS.forEach(k=>META[k].al.forEach(a=>al.push([a,k])));al.sort((a,b)=>b[0].length-a[0].length);
  al.forEach(([a,k])=>{const i=s.indexOf(a);if(i>=0){if(!got.includes(k))got.push(k);s=s.slice(0,i)+' '.repeat(a.length)+s.slice(i+a.length)}});return got};
 const ANS=q=>{const t=q.toLowerCase(),ms=find(q);
  if(/what.?if|simulat|scenario|if we|cut|reduce/.test(t)&&/discount|promo|market|acqui|retention|training|plan|integrated/.test(t)){
   const n=+(t.match(/(\d+(\.\d+)?)/)||[0,5])[1],c={disc:0,plan:0,ret:0,acq:0};
   if(/acqui|marketing budget|marketing spend|marketing/.test(t)&&!/discount/.test(t))c.acq=Math.min(30,n||20);else if(/retention|training/.test(t))c.ret=Math.min(3,n||1.5);else if(/integrated|plan/.test(t)&&!/discount/.test(t))Object.assign(c,PRE[4][1]);else c.disc=Math.min(8,n||5);
   const r=simulate(c);return `<p>I ran the scenario through the causal chain (${Object.entries(c).filter(e=>e[1]).map(e=>e[0]+' '+e[1]).join(', ')}).</p><p>Four-quarter profit change: <b>${r.dp>=0?'+':'−'}${cr(Math.abs(r.dp)).replace('−','')}</b>. Net margin in ${PQ[3]} would be ${r.sc[3].nm.toFixed(1)}% against ${r.bs[3].nm.toFixed(1)}% if nothing changes.</p>${c.acq&&!c.disc?'<p>Cutting marketing alone treats a symptom. The upstream causes remain, so the benefit is small.</p>':''}${tl(['sim.scenario()','finance.pnl()'])}<button class="btn ghost" data-go="simulate" style="align-self:flex-start">Open in simulator</button>`}
  if(/why|cause|reason|decline|drop|fall|fell|root/.test(t)&&ms.length<2)return `<p>Net profit fell from ${cr(BR.start)} in ${Q[PEAK]} to ${cr(BR.end)} in ${Q[L]}, a ${Math.abs(pct(BR.start,BR.end)).toFixed(0)}% drop. Revenue held up, so the loss is in margin and cost.</p>${bars(BR.steps.filter(s=>s.v<0).sort((a,b)=>a.v-b.v).map(s=>[s.l,-s.v,cr(s.v),DEPT[s.d].v]))}<p>The chain behind it: <b>${HYP.map(h=>h.t).join('; ')}</b>.</p>${tl(['finance.profit_bridge()','graph.rank_hypotheses()'])}`;
  if(/depart|who|responsib|blame|owner/.test(t)){const o={M:0,O:0,H:0,F:0};BR.steps.forEach(s=>{if(s.v<0)o[s.d]+=-s.v});const tot=Object.values(o).reduce((a,b)=>a+b,0);
   return `<p>No department is solely responsible. Cost lines sit in these teams, but the causes cross boundaries.</p>${bars(Object.keys(o).sort((a,b)=>o[b]-o[a]).map(d=>[DEPT[d].n,o[d],cr(-o[d])+' ('+Math.round(o[d]/tot*100)+'%)',DEPT[d].v]))}<p>The first mover is Marketing's discount depth, but Operations and HR absorb most of the downstream cost. A shared KPI is the structural fix.</p>${tl(['finance.profit_bridge()','stats.onset_timeline()'])}`}
  if(/first|when|timeline|sequence|order|domino|onset|start/.test(t)&&ms.length<2)return `<p>Order of first deviation from baseline:</p><ul>${firstQ.map(x=>`<li><b>${x[0]}</b>: ${x[1].map(k=>META[k].l).join(', ')}</li>`).join('')}</ul><p>Marketing and Operations moved first, HR followed, then customer metrics, and Finance last.</p>${tl(['stats.onset_timeline()'])}`;
  if(/recommend|action|do next|fix|plan|should we/.test(t)&&ms.length<2)return `<p>Highest-value moves, from the simulator:</p><ul>${ACT.filter(a=>a.cfg).sort((a,b)=>b.imp-a.imp).map(a=>`<li>${a.t}: <b>+${cr(a.imp)}</b> over four quarters</li>`).join('')}</ul><p>Pair them with shared KPIs so the gains hold. Each needs human approval.</p><button class="btn ghost" data-go="actions" style="align-self:flex-start">Open the action plan</button>${tl(['sim.scenario()','governance.check()'])}`;
  if(/reliab|trust|confiden|assum|limit|caveat|accura|data/.test(t))return `<p>Treat this as a well-structured lead, not proof.</p><ul><li>The data is assumed sample data for a fictional retailer.</li><li>Twelve quarters of trending data inflate correlations. I test QoQ changes too and flag links that fail.</li><li>Timing helps but cannot prove cause. A promo holdout test would.</li><li>Attribution weights are assumptions you can change.</li></ul>${tl(['stats.detrend_check()','governance.check()'])}`;
  if(ms.length>=2){const [x,y]=ms,r0=pairR(x,y,0,'l'),r1=pairR(x,y,1,'l'),rd=pairR(x,y,0,'d'),rr=pairR(y,x,1,'l'),e=EDGES.find(e=>(e.a===x&&e.b===y)||(e.a===y&&e.b===x));
   return `<p><b>${META[x].l}</b> and <b>${META[y].l}</b> move ${Math.abs(r0)>.8?'strongly':'moderately'} ${r0>0?'together':'in opposite directions'} (r = ${r0.toFixed(2)}).</p><div class="mini"><span>${META[x].l} leads by 1Q</span><div class="bb"><i style="width:${Math.abs(r1)*100}%;background:var(--ink)"></i></div><span>${r1.toFixed(2)}</span><span>${META[y].l} leads by 1Q</span><div class="bb"><i style="width:${Math.abs(rr)*100}%;background:var(--ink)"></i></div><span>${rr.toFixed(2)}</span><span>QoQ change, same quarter</span><div class="bb"><i style="width:${Math.abs(rd)*100}%;background:var(--ink)"></i></div><span>${rd.toFixed(2)}</span></div><p>${e?esc(e.why):'This pair is not a direct link in the causal graph; any relationship likely runs through other metrics.'} ${ONSET[x]>=0&&ONSET[y]>=0?(ONSET[x]<ONSET[y]?`${META[x].l} moved first (${Q[ONSET[x]]}).`:ONSET[x]>ONSET[y]?`${META[y].l} moved first (${Q[ONSET[y]]}).`:`Both moved in ${Q[ONSET[x]]}.`):''}</p>${tl(['stats.lagged_corr()','stats.onset_timeline()'])}`}
  if(ms.length===1){const k=ms[0],a=SER[k],rel=EDGES.filter(e=>e.a===k||e.b===k).slice(0,4);
   return `<p><b>${META[k].l}</b> (${DEPT[META[k].d].n}) went from ${fv(k,a[0])} in ${Q[0]} to ${fv(k,a[L])} in ${Q[L]}${ONSET[k]>=0?', first leaving its baseline in '+Q[ONSET[k]]:''}.</p><div>${spark(a,DEPT[META[k].d].v,260,50)}</div>${rel.length?`<p>Linked in the graph to: ${rel.map(e=>META[e.a===k?e.b:e.a].l+' (r '+e.r.toFixed(2)+')').join(', ')}.</p>`:''}${tl(['memory.get_series()','stats.onset_timeline()'])}`}
  const dm=Object.keys(DEPT).find(d=>t.includes(DEPT[d].n.toLowerCase())||(d==='O'&&/ops/.test(t)));
  if(dm){const ks=IDS.filter(k=>META[k].d===dm);return `<p><b>${DEPT[dm].n}</b> reports ${LOCAL[dm].n.toLowerCase()} at ${LOCAL[dm].v[L]}%, which looks fine. Underneath:</p>${bars(ks.map(k=>[META[k].l,Math.abs(pct(SER[k][PEAK],SER[k][L])),(pct(SER[k][PEAK],SER[k][L])>=0?'+':'−')+Math.abs(pct(SER[k][PEAK],SER[k][L])).toFixed(0)+'%',DEPT[dm].v]))}<p>Change since ${Q[PEAK]}.</p>${tl([dm.toLowerCase()+'.query()'])}`}
  return `<p>I can answer questions about the profit decline, any of the 18 metrics, links between two metrics, department roles, scenarios, and next actions. Try one of the suggestions below.</p>`};
 const ask=q=>{if(!q.trim())return;add('u',esc(q));const id='t'+Date.now();box.insertAdjacentHTML('beforeend',`<div class="msg" id="${id}"><div class="av">AI</div><div class="bub"><div class="typing"><span></span><span></span><span></span></div></div></div>`);box.scrollTop=box.scrollHeight;
  setTimeout(()=>{$('#'+id).remove();add('a',ANS(q))},650)};
 $('#askf').onsubmit=e=>{e.preventDefault();const i=$('#q');ask(i.value);i.value=''};
 $('#sugg').onclick=e=>{const b=e.target.closest('button');if(b)ask(b.textContent)};
 add('a','<p>I am the profit analyst for NovaCart. I have joined Marketing, HR, Operations and Finance data and traced the decline. Ask me anything, or start with the first question below.</p>');
 box.insertAdjacentHTML('beforeend',`<div class="msg u"><div class="av">You</div><div class="bub">Why did profit decline?</div></div>`);add('a',ANS('Why did profit decline?'))};
/* ---------- boot ---------- */
show((location.hash||'#overview').slice(1));

</script>
